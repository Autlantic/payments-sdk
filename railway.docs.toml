# Autlantic Payments docs — docs.autlantic.com
# Railway: new service → Settings → Config file path → railway.docs.toml

[build]
builder = "NIXPACKS"
nixpacksConfigPath = "nixpacks.docs.toml"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @autlantic/docs build"
watchPatterns = [
  "apps/docs/**",
  "railway.docs.toml",
  "nixpacks.docs.toml",
  "pnpm-lock.yaml",
]

[deploy]
startCommand = "pnpm --filter @autlantic/docs start"
restartPolicyType = "ON_FAILURE"

# Railway → Settings → Networking → Custom domain: docs.autlantic.com
