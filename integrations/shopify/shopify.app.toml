# https://shopify.dev/docs/apps/tools/cli/configuration
# Payments apps: keep embedded=false. Payment session scopes come from the extension on first deploy.

client_id = "1076e5632cf38def63683bcf3c4185f2"
name = "Autlantic Billing"
application_url = "https://shopify.autlantic.com"
embedded = false

[access_scopes]
scopes = "read_orders,write_orders"

[auth]
redirect_urls = [ "https://shopify.autlantic.com/auth/callback" ]

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/shopify"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/shopify"

[pos]
embedded = false
