<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Status · Autlantic Billing</title>
    <meta
      name="description"
      content="Live operational status for Autlantic Billing API, merchant portal, and docs."
    />
    <link rel="icon" href="https://docs.autlantic.com/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-accent: #5672cd;
        --color-accent-strong: #3451b2;
        --color-accent-muted: #ebefff;
        --color-crypto: #00875a;
        --color-surface: #ffffff;
        --color-surface-muted: #f6f6f7;
        --color-surface-subtle: #f9f9f9;
        --color-ink: #191c1f;
        --color-ink-secondary: #5b667a;
        --color-ink-muted: #8b95a8;
        --color-border: rgb(25 28 31 / 0.08);
        --color-danger: #dc2626;
        --color-warning: #d97706;
        --shadow-card: 0 1px 2px rgb(25 28 31 / 0.04), 0 8px 24px rgb(25 28 31 / 0.06);
        --radius-card: 1.25rem;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --color-accent: #5c73e7;
          --color-accent-strong: #3e63dd;
          --color-accent-muted: rgb(100 108 255 / 0.16);
          --color-crypto: #3dd68c;
          --color-surface: #161618;
          --color-surface-muted: #202127;
          --color-surface-subtle: #1b1b1f;
          --color-ink: #ffffff;
          --color-ink-secondary: #c8cdd6;
          --color-ink-muted: #989eab;
          --color-border: rgb(255 255 255 / 0.1);
          --color-danger: #f87171;
          --color-warning: #fbbf24;
          --shadow-card: 0 1px 2px rgb(0 0 0 / 0.35), 0 12px 32px rgb(0 0 0 / 0.35);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: var(--color-ink);
        background: var(--color-surface);
        -webkit-font-smoothing: antialiased;
      }

      .app-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse 90% 55% at 12% -10%,
            color-mix(in srgb, var(--color-accent) 12%, transparent),
            transparent 52%
          ),
          radial-gradient(
            ellipse 70% 45% at 92% 8%,
            color-mix(in srgb, var(--color-crypto) 8%, transparent),
            transparent 48%
          ),
          linear-gradient(180deg, var(--color-surface-subtle) 0%, var(--color-surface) 42%);
      }

      .shell {
        position: relative;
        z-index: 1;
        max-width: 720px;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 4rem;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.5rem 0 2rem;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
      }

      .brand img {
        height: 2rem;
        width: auto;
        display: block;
      }

      .brand .mark-dark {
        display: none;
      }

      @media (prefers-color-scheme: dark) {
        .brand .mark-light {
          display: none;
        }
        .brand .mark-dark {
          display: block;
        }
      }

      .nav-links {
        display: flex;
        gap: 1rem;
        font-size: 0.875rem;
      }

      .nav-links a {
        color: var(--color-ink-secondary);
        text-decoration: none;
        font-weight: 500;
      }

      .nav-links a:hover {
        color: var(--color-accent-strong);
      }

      h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: clamp(2rem, 5vw, 2.75rem);
        letter-spacing: -0.02em;
        line-height: 1.15;
        margin: 0 0 0.5rem;
        color: var(--color-ink);
      }

      .lede {
        color: var(--color-ink-secondary);
        margin: 0 0 1.75rem;
        line-height: 1.55;
        max-width: 36rem;
        font-size: 1.015rem;
      }

      .overall {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        padding: 1.1rem 1.2rem;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-card);
        background: var(--color-surface);
        box-shadow: var(--shadow-card);
        margin-bottom: 1rem;
        animation: fade-up 0.55s ease-out both;
      }

      .dot {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 50%;
        background: var(--color-warning);
        flex-shrink: 0;
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--color-warning) 18%, transparent);
      }

      .dot.ok {
        background: var(--color-crypto);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--color-crypto) 18%, transparent);
      }

      .dot.bad {
        background: var(--color-danger);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--color-danger) 18%, transparent);
      }

      .overall strong {
        font-size: 1.05rem;
        font-weight: 600;
      }

      .meta {
        color: var(--color-ink-muted);
        font-size: 0.85rem;
        margin-top: 0.2rem;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 0.75rem;
      }

      li {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 0.75rem;
        align-items: start;
        padding: 1rem 1.1rem;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-card);
        background: var(--color-surface);
        box-shadow: var(--shadow-card);
        animation: fade-up 0.65s ease-out both;
      }

      li:nth-child(2) {
        animation-delay: 0.06s;
      }
      li:nth-child(3) {
        animation-delay: 0.12s;
      }

      .name {
        font-weight: 600;
        color: var(--color-ink);
      }

      .detail {
        color: var(--color-ink-muted);
        font-size: 0.85rem;
        grid-column: 2 / -1;
        line-height: 1.4;
      }

      .badge {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--color-warning);
      }

      .badge.ok {
        color: var(--color-crypto);
      }

      .badge.bad {
        color: var(--color-danger);
      }

      footer {
        margin-top: 2.25rem;
        color: var(--color-ink-muted);
        font-size: 0.9rem;
        line-height: 1.55;
        animation: fade-up 0.7s ease-out 0.15s both;
      }

      footer a {
        color: var(--color-accent-strong);
        text-decoration: none;
        font-weight: 500;
      }

      footer a:hover {
        text-decoration: underline;
      }

      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="app-bg" aria-hidden="true"></div>
    <div class="shell">
      <header>
        <a class="brand" href="https://autlantic.com" aria-label="Autlantic">
          <img
            class="mark-light"
            src="https://portal.autlantic.com/brand/autlantic-wordmark.svg"
            alt=""
            width="140"
            height="32"
          />
          <img
            class="mark-dark"
            src="https://portal.autlantic.com/brand/autlantic-wordmark-light.svg"
            alt=""
            width="140"
            height="32"
          />
        </a>
        <nav class="nav-links" aria-label="Related">
          <a href="https://docs.autlantic.com">Docs</a>
          <a href="https://portal.autlantic.com">Portal</a>
        </nav>
      </header>

      <h1>Billing status</h1>
      <p class="lede">
        Live checks for Autlantic Billing. Probes run from this service against production
        origins and refresh every minute.
      </p>

      <div class="overall" id="overall">
        <span class="dot" id="overall-dot"></span>
        <div>
          <strong id="overall-label">Checking…</strong>
          <div class="meta" id="overall-meta"></div>
        </div>
      </div>
      <ul id="checks"></ul>
      <footer>
        Primary signal: Billing API <code>GET /healthz</code>. Incidents:
        <a href="mailto:support@autlantic.com">support@autlantic.com</a>. Guide:
        <a href="https://docs.autlantic.com/resources/status">status docs</a>.
      </footer>
    </div>
    <script>
      const list = document.getElementById("checks");
      const overallLabel = document.getElementById("overall-label");
      const overallMeta = document.getElementById("overall-meta");
      const overallDot = document.getElementById("overall-dot");

      function setBadge(el, state) {
        el.className = "badge " + state;
        el.textContent = state === "ok" ? "Operational" : state === "bad" ? "Down" : "Checking";
      }

      async function run() {
        list.innerHTML = "";
        try {
          const res = await fetch("/api/status", { cache: "no-store" });
          const data = await res.json();
          const state = data.state || "partial";
          overallDot.className =
            "dot " + (state === "operational" ? "ok" : state === "major" ? "bad" : "");
          overallLabel.textContent =
            state === "operational"
              ? "All systems operational"
              : state === "major"
                ? "Major outage"
                : "Partial outage";
          overallMeta.textContent =
            "Last checked " +
            new Date(data.checkedAt || Date.now()).toLocaleString() +
            " · refreshes every 60s";

          for (const check of data.checks || []) {
            const li = document.createElement("li");
            const dot = document.createElement("span");
            dot.className = "dot " + (check.ok ? "ok" : "bad");
            const name = document.createElement("div");
            name.className = "name";
            name.textContent = check.name;
            const badge = document.createElement("div");
            setBadge(badge, check.ok ? "ok" : "bad");
            const detail = document.createElement("div");
            detail.className = "detail";
            detail.textContent = check.detail || check.url;
            li.append(dot, name, badge, detail);
            list.append(li);
          }
        } catch (err) {
          overallDot.className = "dot bad";
          overallLabel.textContent = "Status service unreachable";
          overallMeta.textContent = err && err.message ? err.message : "Failed to load /api/status";
        }
      }

      run();
      setInterval(run, 60_000);
    </script>
  </body>
</html>
