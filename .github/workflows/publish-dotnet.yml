# Publish .NET SDK to NuGet on tags like sdks/dotnet/v0.1.1
# Requires nuget.org Trusted Publishing policy:
#   Repository Owner: Autlantic
#   Repository: payments-sdk
#   Workflow File: publish-dotnet.yml
name: Publish .NET SDK

on:
  push:
    tags:
      - "sdks/dotnet/v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dotnet
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test --nologo -v q

      - name: Pack
        run: |
          dotnet pack src/Autlantic.Billing/Autlantic.Billing.csproj \
            -c Release \
            -o ./nupkg \
            --nologo

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          # nuget.org profile username (not email)
          user: arslankahmed

      - name: Push
        run: |
          dotnet nuget push ./nupkg/Autlantic.Billing.*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
