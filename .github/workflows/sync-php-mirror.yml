# Sync sdks/php → Autlantic/billing-php (Packagist-friendly root).
# Requires repo secret BILLING_PHP_TOKEN (PAT with contents:write on Autlantic/billing-php).
name: Sync PHP SDK mirror

on:
  push:
    tags:
      - "sdks/php/v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require mirror token
        env:
          TOKEN: ${{ secrets.BILLING_PHP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Add GitHub Actions secret BILLING_PHP_TOKEN (PAT with write access to Autlantic/billing-php)."
            exit 1
          fi

      - name: Push mirror
        env:
          TOKEN: ${{ secrets.BILLING_PHP_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-}"
          VERSION="0.1.0"
          if [[ "$TAG" == sdks/php/v* ]]; then
            VERSION="${TAG#sdks/php/v}"
          fi
          export VERSION

          WORK=$(mktemp -d)
          rsync -a --exclude vendor --exclude .phpunit.cache --exclude composer.lock \
            sdks/php/ "$WORK/"
          cd "$WORK"

          python3 - <<'PY'
          import json, os
          path = "composer.json"
          with open(path) as f:
              data = json.load(f)
          data["version"] = os.environ["VERSION"]
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

          git init -b main
          git config user.email "support@autlantic.com"
          git config user.name "Autlantic"
          git add -A
          git commit -m "autlantic/billing ${VERSION} (synced from payments-sdk)"

          git remote add origin "https://x-access-token:${TOKEN}@github.com/Autlantic/billing-php.git"
          git push -f origin main

          if [[ "$TAG" == sdks/php/v* ]]; then
            git tag -a "v${VERSION}" -m "autlantic/billing ${VERSION}"
            git push -f origin "v${VERSION}"
          fi
