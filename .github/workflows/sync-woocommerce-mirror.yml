# Sync integrations/woocommerce → Autlantic/woocommerce-autlantic and attach a vendored zip.
# Requires repo secret WOOCOMMERCE_MIRROR_TOKEN (PAT with contents:write on that mirror).
# Create the empty public repo once before the first tag.
name: Sync WooCommerce plugin mirror

on:
  push:
    tags:
      - "integrations/woocommerce/v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require mirror token
        env:
          TOKEN: ${{ secrets.WOOCOMMERCE_MIRROR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Add GitHub Actions secret WOOCOMMERCE_MIRROR_TOKEN (PAT with write access to Autlantic/woocommerce-autlantic)."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          coverage: none

      - name: Package vendored zip
        run: bash integrations/woocommerce/bin/package.sh

      - name: Push mirror and release
        env:
          TOKEN: ${{ secrets.WOOCOMMERCE_MIRROR_TOKEN }}
          GH_TOKEN: ${{ secrets.WOOCOMMERCE_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-}"
          VERSION="1.0.0"
          if [[ "$TAG" == integrations/woocommerce/v* ]]; then
            VERSION="${TAG#integrations/woocommerce/v}"
          fi
          export VERSION

          WORK=$(mktemp -d)
          rsync -a \
            --exclude vendor \
            --exclude dist \
            --exclude bin \
            --exclude composer.lock \
            --exclude .DS_Store \
            integrations/woocommerce/ "$WORK/"
          cd "$WORK"

          python3 - <<'PY'
          import json, os
          path = "composer.json"
          with open(path) as f:
              data = json.load(f)
          data.pop("repositories", None)
          data["version"] = os.environ["VERSION"]
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

          git init -b main
          git config user.email "support@autlantic.com"
          git config user.name "Autlantic"
          git add -A
          git commit -m "autlantic-billing ${VERSION} (synced from payments-sdk)"

          git remote add origin "https://x-access-token:${TOKEN}@github.com/Autlantic/woocommerce-autlantic.git"
          git push -f origin main

          if [[ "$TAG" == integrations/woocommerce/v* ]]; then
            git tag -a "v${VERSION}" -m "autlantic-billing ${VERSION}"
            git push -f origin "v${VERSION}"
            ZIP="$(ls -1 "$GITHUB_WORKSPACE"/integrations/woocommerce/dist/autlantic-billing-*.zip | head -1)"
            gh release create "v${VERSION}" "$ZIP" \
              --repo Autlantic/woocommerce-autlantic \
              --title "autlantic-billing ${VERSION}" \
              --notes "WordPress plugin zip with the PHP SDK vendored. Upload via Plugins → Add New."
          fi
